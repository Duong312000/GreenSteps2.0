<!-- Ultra-sleek Luxury Top Navigation Progress Bar -->
<div class="route-progress-bar-container" *ngIf="isNavigating" aria-hidden="true">
  <div class="route-progress-bar-glow"></div>
  <div class="route-progress-bar-peg"></div>
</div>

<app-header *ngIf="!isAdminRoute && !isStandalonePolicyRoute && !isStandaloneMaintenanceRoute"></app-header>
<div class="profile-route-shell" *ngIf="isProfileMenuRoute">
  <app-profile-navigation></app-profile-navigation>
  <div class="profile-route-shell__content">
    <router-outlet></router-outlet>
  </div>
</div>
<router-outlet *ngIf="!isProfileMenuRoute"></router-outlet>
<app-footer *ngIf="!isAdminRoute && !isStandalonePolicyRoute && !isStandaloneMaintenanceRoute && !isPlannerRoute && !isScheduleRoute"></app-footer>
<app-greensteps-chat *ngIf="!isAdminRoute && !isProfileRoute && !isScheduleRoute && !isStandalonePolicyRoute && !isStandaloneMaintenanceRoute && !isPlannerRoute"></app-greensteps-chat>
<app-onboarding-tour *ngIf="!isAdminRoute && !isProfileRoute && !isStandaloneMaintenanceRoute"></app-onboarding-tour>
